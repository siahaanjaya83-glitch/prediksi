name: Update GoalPredict Football Data

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update CSV-derived JSON
        run: node scripts/update-football-data.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/football-2026-results.json data/football-2026-fixtures.json data/football-2026-sync.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): update 2026 football data"
            git push
          fi
